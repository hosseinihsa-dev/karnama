<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>کارنما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<header>
  <div>
    <h1 id="greet">سلام! امروز مال توست</h1>
    <p id="sub"></p>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:none">
    <div id="logo">ک</div>
    <span style="font:600 9px inherit;color:#5E6169">نسخه ۸</span>
  </div>
</header>

<main><div id="view" class="col"></div></main>

<button id="fab" aria-label="افزودن کار"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/></svg></button>

<nav>
  <button data-tab="0" class="on"><i></i><span>امروز</span></button>
  <button data-tab="1"><i></i><span>هفته</span></button>
  <button data-tab="2"><i></i><span>دسته‌ها</span></button>
</nav>

<div id="ov">
  <div id="scrim"></div>
  <div id="sheet">
    <div class="grab"></div>
    <div class="sh-t" id="sh-title">چی تو ذهنته؟</div>
    <textarea id="draft" rows="3" placeholder="مثلاً: هفته‌ی دیگه با دکتر قرار بگیرم"></textarea>
    <div id="prev">
      <div class="pv-l">کارنما این‌طور فهمید — برای تغییر، روی هرکدام بزن</div>
      <div class="chips" id="pvchips"></div>
    </div>
    <button id="submit">بسپار به کارنما</button>
    <button id="sh-del">حذف این کار</button>
    <div class="hint">می‌توانی بنویسی «هر روز صبح ورزش کنم» — تکرار را خودش می‌فهمد.</div>
  </div>
</div>

<div id="pick"><div class="bd"></div><div class="bx"></div></div>
<div id="toast"></div>

<script src="app.js?v=8"></script>
</body>
</html>
