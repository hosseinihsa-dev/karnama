<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>کارنما</title>
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>

<header>
  <div>
    <h1 id="greet">سلام! امروز مال توست</h1>
    <p id="sub"></p>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:none">
    <div id="logo">ک</div>
    <span style="font:600 9px inherit;color:#5E6169">نسخه ۲۵</span>
  </div>
</header>

<main><div id="view" class="col"></div></main>

<button id="fab" aria-label="افزودن کار"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/></svg></button>

<nav>
  <button data-tab="0" class="on"><i></i><span>امروز</span></button>
  <button data-tab="1"><i></i><span>فردا</span></button>
  <button data-tab="2"><i></i><span>هفته</span></button>
  <button data-tab="3"><i></i><span>ماه</span></button>
  <button data-tab="4"><i></i><span>دسته‌ها</span></button>
</nav>

<div id="ov">
  <div id="scrim"></div>
  <div id="sheet">
    <div class="grab"></div>
    <div class="sh-t" id="sh-title">چی تو ذهنته؟</div>
    <textarea id="draft" rows="3" placeholder="مثلاً: هر پنجشنبه ساعت ۱۷ مافیا"></textarea>
    <div id="prev">
      <div class="pv-l">کارنما این‌طور فهمید — برای تغییر، روی هرکدام بزن</div>
      <div class="chips" id="pvchips"></div>
      <div id="pv-title"></div>
    </div>
    <button id="submit">بسپار به کارنما</button>
    <button id="sh-del">حذف این کار</button>
    <div class="hint">راحت بنویس — کارنما عنوان، روز، ساعت، تکرار و پایان تکرار را خودش درمی‌آورد.</div>
  </div>
</div>

<div id="pick"><div class="bd"></div><div class="bx"></div></div>
<input type="file" id="imp" accept="application/json,.json" style="display:none">
<div id="toast"></div>

<script src="app.js?v=25"></script>
</body>
</html>
